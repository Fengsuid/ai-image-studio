<!doctype html>
<html lang="zh-CN" data-app="admin" data-density="compact">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ai-image-studio Admin</title>
    <link href="/vendor/icons/remixicon.min.css" rel="stylesheet">
    <link href="/vendor/icons/remixicon-compat.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=20260602-visual-hero-composer-v1">
  </head>
  <body class="admin-body">
    <div id="adminApp" class="admin-shell" data-admin-page="overview">
      <aside class="admin-sidebar primitive-drawer" data-primitive-drawer-static="true" aria-label="后台主导航" aria-describedby="adminNavHelp">
        <div class="admin-sidebar-head">
          <a class="admin-brand" href="/">
            <span><i class="ri-sparkling-2-fill"></i></span>
            <strong>ai-image-studio</strong>
          </a>
        </div>
        <p id="adminNavHelp" class="admin-sr-only">使用导航切换后台模块；移动端可通过顶部按钮打开或关闭菜单。</p>
        <nav id="adminNav" class="admin-nav" aria-label="后台导航"></nav>
      </aside>
      <button id="adminSidebarBackdrop" class="admin-sidebar-backdrop hidden" type="button" aria-hidden="true" tabindex="-1"></button>

      <main class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar-row admin-topbar-global">
            <div class="admin-global-left">
              <button id="adminSidebarToggle" class="btn btn--ghost btn--icon admin-sidebar-toggle" type="button" aria-label="切换后台导航" aria-controls="adminNav" title="切换后台导航">
                <i class="ri-side-bar-line"></i>
              </button>
              <span class="admin-shell-context" aria-hidden="true">Admin</span>
            </div>
            <label class="admin-topbar-search">
              <i class="ri-search-line" aria-hidden="true"></i>
              <input id="adminGlobalSearch" type="search" placeholder="搜索模块、用户、提示词" aria-label="搜索后台内容">
            </label>
            <div class="admin-status admin-global-actions">
              <button id="adminCommandPaletteBtn" class="btn btn--ghost btn--icon" type="button" aria-label="打开命令面板" title="命令面板"><i class="ri-command-line" aria-hidden="true"></i></button>
              <button class="btn btn--ghost btn--icon" type="button" aria-label="通知中心" title="通知中心"><i class="ri-notification-3-line"></i></button>
              <span id="adminStatus" class="admin-status-pill primitive-pill">Checking...</span>
              <span id="adminUserLabel" class="admin-user-chip primitive-pill">-</span>
              <a class="btn btn--ghost btn--icon" href="/" title="返回前台" aria-label="返回前台"><i class="ri-home-5-line"></i></a>
            </div>
          </div>
          <div class="admin-topbar-row admin-topbar-page">
            <div class="admin-page-heading">
              <p id="adminEyebrow">后台 / 总览</p>
              <h1 id="adminPageTitle">总览</h1>
              <small id="adminPageDescription">运营态势、系统风险和近期生成请求。</small>
            </div>
            <div class="admin-page-actions">
              <div id="adminViewSwitch" class="admin-view-switch" role="group" aria-label="页面视图">
                <button class="btn btn--secondary active" type="button" aria-pressed="true">工作台</button>
                <button class="btn btn--ghost" type="button" disabled>详情</button>
              </div>
              <button id="adminRefreshBtn" class="btn btn--primary" type="button" title="刷新"><i class="ri-refresh-line"></i>刷新</button>
            </div>
          </div>
        </header>

        <section id="adminNotice" class="admin-notice hidden"></section>
        <section id="adminContent" class="admin-content" data-admin-section="overview"></section>
        <div id="adminDrawerBackdrop" class="admin-drawer-backdrop primitive-drawer-layer hidden" aria-hidden="true"></div>
        <aside id="adminDrawer" class="admin-drawer primitive-drawer hidden" aria-hidden="true"></aside>
      </main>
    </div>
    <div id="adminConfirmLayer" class="admin-confirm-layer hidden" aria-live="polite" aria-hidden="true"></div>
    <div id="adminToastLayer" class="toast-layer" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/client-error-monitor.js?v=20260602-visual-hero-composer-v1" defer></script>
    <script src="/app-modules.js?v=20260602-visual-hero-composer-v1" defer></script>
    <script src="/frontend-build-manifest.js?v=20260602-visual-hero-composer-v1" defer></script>
    <script src="/app-router.js?v=20260602-visual-hero-composer-v1" data-route-entry="admin" defer></script>
  </body>
</html>
